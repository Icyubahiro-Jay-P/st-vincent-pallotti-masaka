name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings + production env
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build with production config
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt output as a non-production ("green") deployment
        id: deploy_green
        run: |
          url=$(vercel deploy --prebuilt --prod=false --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # ssoProtection is enabled for all deployment URLs except assigned/
      # custom domains, so the green deployment's unique URL needs the
      # automation bypass header to be reachable at all.
      - name: Smoke test the green deployment
        run: node scripts/smoke-test.mjs "${{ steps.deploy_green.outputs.url }}"
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Promote green deployment to production (atomic alias flip)
        run: vercel promote "${{ steps.deploy_green.outputs.url }}" --token="${{ secrets.VERCEL_TOKEN }}" --yes
